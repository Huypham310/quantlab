name: CI

# Free ubuntu-latest runners only. Nothing is pushed anywhere: the docker job just builds.
on:
  push:
    branches: [main]
  pull_request:

# a new push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        # the model tests need LightGBM + torch; the CPU wheel keeps the download small (no CUDA)
        run: pip install -e ".[dev,ml]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Ruff
        run: ruff check .
      - name: Pytest
        # SQLite + fakeredis + mocked HTTP, so no services are needed
        run: pytest -q --cov=quantlab --cov-report=term-missing

  gateway:
    name: gateway (go vet + go test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        # -race catches data races in the reader/writer goroutines
        run: go test -race -count=1 ./...

  web:
    name: web (lint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: web e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium
        # --with-deps pulls the system libraries Chromium needs on a bare runner
        run: npx playwright install --with-deps chromium
      - name: Playwright
        # the API is mocked in the specs, so no backend is started (see web/e2e/mocks.ts)
        run: npm run e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  docker:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # only worth building once the tests are green
    needs: [backend, gateway, web, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: quantlab-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build gateway
        uses: docker/build-push-action@v6
        with:
          context: gateway
          push: false
          tags: quantlab-gateway:ci
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: quantlab-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Validate compose file
        run: docker compose config -q
