[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Backtesting and paper-trading backend"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "polars>=1.12",
  "numpy>=2.0",
  "httpx>=0.27",
  "numba>=0.60",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "celery[redis]>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7", "fakeredis>=2.26", "hypothesis>=6.120"]
# ML signals; torch is big, so it stays optional (CPU wheels are enough for the LSTM)
ml = ["lightgbm>=4.5", "optuna>=4.0", "scikit-learn>=1.5", "scipy>=1.13", "torch>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to sit in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
