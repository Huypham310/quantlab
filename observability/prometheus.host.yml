# Same jobs as prometheus.yml, for the apps running on the host (uvicorn, Go gateway, ...) while
# Prometheus runs in Docker: it reaches them through host.docker.internal (see extra_hosts in
# docker-compose.yml; works on Docker Desktop for Windows and on Linux).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: quantlab-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: quantlab-gateway
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: quantlab-worker
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: quantlab-consumer
    static_configs:
      - targets: ["host.docker.internal:9102"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
